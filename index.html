
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#b5121b">
  <meta name="description" content="Taller Azteca: registro de clientes, servicios, refacciones y cobros de motocicletas.">
  <link rel="manifest" href="./manifest.json">
  <title>Taller Azteca</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      text-align: center;
      padding: 20px 5px;
      border-bottom: 3px solid #b5121b;
    }

    h1 {
      color: #e6b52b;
      margin: 5px;
      font-size: 28px;
    }

    h2 {
      color: #e6b52b;
      font-size: 20px;
    }

    .panel {
      background: #222;
      padding: 16px;
      border-radius: 12px;
      margin-top: 18px;
    }

    input, textarea, select, button {
      width: 100%;
      padding: 13px;
      margin: 7px 0;
      border-radius: 7px;
      font-size: 16px;
    }

    input, textarea, select {
      background: #333;
      color: white;
      border: 1px solid #555;
    }

    button {
      background: #b5121b;
      color: white;
      border: 0;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      opacity: .8;
    }

    .registro {
      background: #333;
      padding: 13px;
      border-radius: 8px;
      margin: 12px 0;
      overflow-wrap: anywhere;
    }

    .total {
      color: #e6b52b;
      font-size: 27px;
      font-weight: bold;
    }

    .secundario {
      background: #555;
    }

    .pagado {
      color: #65d98a;
      font-weight: bold;
    }

    .pendiente {
      color: #ffcc66;
      font-weight: bold;
    }

    small {
      color: #bbb;
    }

    .acciones {
      display: flex;
      gap: 8px;
    }

    .acciones button {
      flex: 1;
    }
  </style>
</head>

<body>

  <header>
    <h1>🏍️ TALLER AZTECA</h1>
    <p>Tu moto en buenas manos</p>
    <small>Control de servicios y cobros</small>
  </header>

  <section class="panel">
    <h2>Registrar servicio</h2>

    <input id="cliente" placeholder="Nombre del cliente">
    <input id="telefono" type="tel" placeholder="Teléfono del cliente">
    <input id="moto" placeholder="Motocicleta y modelo">

    <textarea id="trabajo" rows="3"
      placeholder="Trabajo realizado"></textarea>

    <input id="refacciones" type="number" min="0" step="0.01"
      placeholder="Costo de refacciones ($)">

    <input id="mano" type="number" min="0" step="0.01"
      placeholder="Mano de obra ($)">

    <button onclick="guardar()">GUARDAR SERVICIO</button>
  </section>

  <section class="panel">
    <h2>Resumen de cobros</h2>

    <p>Total de servicios:</p>
    <div class="total" id="total">$0.00</div>

    <p id="cantidad">0 servicios registrados</p>

    <p>Dinero cobrado:</p>
    <div class="total" id="cobrado">$0.00</div>

    <p>Dinero pendiente:</p>
    <div class="total" id="pendiente">$0.00</div>
  </section>

  <section class="panel">
    <h2>Historial de trabajos</h2>
    <div id="historial"></div>
  </section>

  <script>
    let servicios = [];

    try {
      servicios = JSON.parse(
        localStorage.getItem("azteca_servicios") || "[]"
      );

      if (!Array.isArray(servicios)) servicios = [];
    } catch (error) {
      servicios = [];
    }

    function dinero(cantidad) {
      return Number(cantidad).toLocaleString("es-MX", {
        style: "currency",
        currency: "MXN"
      });
    }

    function guardar() {
      const cliente = document.getElementById("cliente").value.trim();
      const telefono = document.getElementById("telefono").value.trim();
      const moto = document.getElementById("moto").value.trim();
      const trabajo = document.getElementById("trabajo").value.trim();

      const refacciones = Number(
        document.getElementById("refacciones").value || 0
      );

      const mano = Number(
        document.getElementById("mano").value || 0
      );

      if (!cliente || !moto || !trabajo) {
        alert("Completa el cliente, la motocicleta y el trabajo.");
        return;
      }

      if (
        !Number.isFinite(refacciones) ||
        !Number.isFinite(mano) ||
        refacciones < 0 ||
        mano < 0
      ) {
        alert("Revisa los costos ingresados.");
        return;
      }

      const servicio = {
        id: Date.now(),
        cliente: cliente,
        telefono: telefono,
        moto: moto,
        trabajo: trabajo,
        refacciones: refacciones,
        mano: mano,
        total: refacciones + mano,
        fecha: new Date().toLocaleDateString("es-MX"),
        pagado: false
      };

      servicios.unshift(servicio);

      if (!guardarDatos()) {
        servicios.shift();
        return;
      }

      [
        "cliente",
        "telefono",
        "moto",
        "trabajo",
        "refacciones",
        "mano"
      ].forEach(id => {
        document.getElementById(id).value = "";
      });

      mostrar();
      alert("¡Servicio guardado correctamente!");
    }

    function guardarDatos() {
      try {
        localStorage.setItem(
          "azteca_servicios",
          JSON.stringify(servicios)
        );
        return true;
      } catch (error) {
        alert("No se pudieron guardar los datos. Revisa el espacio disponible.");
        return false;
      }
    }

    function marcarPagado(id) {
      const servicio = servicios.find(s => s.id === id);

      if (!servicio) return;

      servicio.pagado = true;

      if (guardarDatos()) {
        mostrar();
      }
    }

    function eliminar(id) {
      if (!confirm("¿Quieres eliminar este servicio?")) return;

      const anteriores = servicios;
      servicios = servicios.filter(s => s.id !== id);

      if (!guardarDatos()) {
        servicios = anteriores;
        return;
      }

      mostrar();
    }

    function mostrar() {
      const historial = document.getElementById("historial");

      historial.innerHTML = "";

      let total = 0;
      let cobrado = 0;
      let pendiente = 0;

      servicios.forEach(servicio => {
        total += servicio.total;

        if (servicio.pagado) {
          cobrado += servicio.total;
        } else {
          pendiente += servicio.total;
        }

        const tarjeta = document.createElement("div");
        tarjeta.className = "registro";

        const titulo = document.createElement("h3");
        titulo.textContent = servicio.cliente;

        const datos = document.createElement("p");
        datos.textContent =
          "Fecha: " + servicio.fecha +
          "\nMoto: " + servicio.moto +
          "\nTeléfono: " + (servicio.telefono || "No registrado") +
          "\nTrabajo: " + servicio.trabajo +
          "\nRefacciones: " + dinero(servicio.refacciones) +
          "\nMano de obra: " + dinero(servicio.mano) +
          "\nTotal: " + dinero(servicio.total);

        datos.style.whiteSpace = "pre-line";

        const estado = document.createElement("p");
        estado.textContent = servicio.pagado ? "PAGADO" : "PENDIENTE DE PAGO";
        estado.className = servicio.pagado ? "pagado" : "pendiente";

        tarjeta.appendChild(titulo);
        tarjeta.appendChild(datos);
        tarjeta.appendChild(estado);

        const acciones = document.createElement("div");
        acciones.className = "acciones";

        if (!servicio.pagado) {
          const botonPago = document.createElement("button");
          botonPago.textContent = "Registrar pago";
          botonPago.onclick = () => marcarPagado(servicio.id);
          acciones.appendChild(botonPago);
        }

        const botonEliminar = document.createElement("button");
        botonEliminar.textContent = "Eliminar";
        botonEliminar.className = "secundario";
        botonEliminar.onclick = () => eliminar(servicio.id);

        acciones.appendChild(botonEliminar);
        tarjeta.appendChild(acciones);

        historial.appendChild(tarjeta);
      });

      document.getElementById("total").textContent = dinero(total);
      document.getElementById("cobrado").textContent = dinero(cobrado);
      document.getElementById("pendiente").textContent = dinero(pendiente);

      document.getElementById("cantidad").textContent =
        servicios.length + " servicios registrados";

      if (servicios.length === 0) {
        historial.textContent = "Todavía no hay servicios registrados.";
      }
    }

    mostrar();

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js")
          .catch(error => console.log("Service Worker:", error));
      });
    }
  </script>

</body>
</html>
